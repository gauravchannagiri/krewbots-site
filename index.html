<style>
:root{--bg:#05060F;--v:#7C4DFF;--c:#00E5FF;--m:#FF3D9A;--t:#EEF2FF}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--t);font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(60% 45% at 50% 46%,rgba(124,77,255,.16),transparent 70%),radial-gradient(40% 30% at 62% 52%,rgba(0,229,255,.08),transparent 70%)}
main{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 80px;text-align:center}
picture img{display:block;width:min(880px,94vw);height:auto;filter:drop-shadow(0 0 24px rgba(124,77,255,.25));animation:in 1.4s ease-out both}
h1{margin-top:clamp(12px,3vw,28px);font-weight:600;font-size:clamp(24px,4.2vw,44px);letter-spacing:-.02em;line-height:1.15;animation:in 1.4s .25s ease-out both}
h1 span{background:linear-gradient(90deg,var(--v),var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:14px;font-size:clamp(13px,1.6vw,16px);letter-spacing:.18em;text-transform:uppercase;color:rgba(238,242,255,.6);animation:in 1.4s .45s ease-out both}
p::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);margin-right:10px;vertical-align:middle;animation:pulse 2.4s infinite}
footer{position:fixed;bottom:18px;left:0;right:0;z-index:1;text-align:center;font-size:12px;letter-spacing:.08em;color:rgba(238,242,255,.4)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="glow"></div>
<main>
<picture>
<source srcset="/assets/krewbots-logo.webp" type="image/webp">
<img src="/assets/krewbots-logo.jpg" width="1600" height="500" alt="KrewBots logo: three armoured robots inside a neon hexagon">
</picture>
<h1>Your AI agent <span>crew</span> is assembling.</h1>
<p>Coming soon to krewbots.in</p>
</main>
<footer>© 2026 KrewBots</footer>
<script>
(()=>{const c=document.getElementById('bg'),x=c.getContext('2d');let W,H,R=34,cells=[],pulses=[];const cols=['124,77,255','0,229,255','255,61,154'];
const still=matchMedia('(prefers-reduced-motion:reduce)').matches;
function size(){const d=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);R=W<600?26:36;cells=[];const w=Math.sqrt(3)*R,h=1.5*R;for(let r=-1;r*h<H+R;r++)for(let q=-1;q*w<W+w;q++)cells.push({x:q*w+(r&1?w/2:0),y:r*h,p:Math.random()*6.28});}
function hex(cx,cy,r){x.beginPath();for(let i=0;i<6;i++){const a=Math.PI/180*(60*i-30);x.lineTo(cx+r*Math.cos(a),cy+r*Math.sin(a));}x.closePath();}
function spawn(){const s=cells[Math.random()*cells.length|0];pulses.push({c:s,t:0,col:cols[Math.random()*3|0]});}
function draw(t){x.clearRect(0,0,W,H);const mx=W/2,my=H/2,md=Math.hypot(mx,my);
for(const s of cells){const d=Math.hypot(s.x-mx,s.y-my)/md;const a=(.05+.04*Math.sin(t/1800+s.p))*(1-d*.6);x.strokeStyle=`rgba(124,77,255,${a})`;x.lineWidth=1;hex(s.x,s.y,R*.94);x.stroke();}
if(!still&&Math.random()<.04&&pulses.length<9)spawn();
pulses=pulses.filter(p=>{p.t+=.012;const a=Math.sin(Math.PI*Math.min(p.t,1));x.strokeStyle=`rgba(${p.col},${a*.55})`;x.shadowColor=`rgba(${p.col},${a})`;x.shadowBlur=14;x.lineWidth=1.4;hex(p.c.x,p.c.y,R*.94);x.stroke();x.shadowBlur=0;return p.t<1;});
if(!still)requestAnimationFrame(draw);}
addEventListener('resize',size);size();for(let i=0;i<5;i++)spawn();pulses.forEach(p=>p.t=.4);requestAnimationFrame(draw);})();
</script>
</body>
